services:
  - type: web
    name: playlist-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: behind Render's proxy, read the visitor's real IP (rate limit) and https scheme.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Secrets: Render asks for these in its dashboard; they are never stored in the repo.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
